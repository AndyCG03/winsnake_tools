name: winsnake_tools
description: "WinSnake Tools - Widget de escritorio con una serpiente animada que camina por la pantalla."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  window_manager: ^0.3.9
  screen_retriever: ^0.1.9
  win32: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/img/serpiente/
    - assets/img/Capybara/
